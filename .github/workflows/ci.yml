name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: shellcheck deploy/*.sh deploy/hooks/*.sh
      - run: go test ./...
      - run: go test -race ./...
      - run: sh -n register-initd.sh scripts/build.sh
      - run: for script in deploy/*.sh deploy/hooks/*.sh; do bash -n "$script"; done

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vps-reality-master-linux
          path: dist/*
