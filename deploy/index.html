<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private, self-hosted file storage service.">
  <meta name="robots" content="noindex, nofollow">
  <title>Selfhosted File Hosting</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #12151a;
      --line: #242931;
      --text: #f1f3f5;
      --muted: #9299a5;
      --accent: #7aa2f7;
      --accent-soft: rgba(122, 162, 247, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(122, 162, 247, 0.07), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 540px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--accent);
      font-weight: 700;
    }

    .card {
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(18, 21, 26, 0.88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #aeb4bf;
      font-size: 12px;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6ee7a8;
      box-shadow: 0 0 0 4px rgba(110, 231, 168, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 14px 0 0;
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
    }

    .description {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .notice {
      margin-top: 32px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--accent-soft);
      color: #c8ced8;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 4px 0;
      color: #666d78;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body { padding: 18px; }
      footer { flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="mark" aria-hidden="true">S</span>
      <span>storage.internal</span>
    </div>

    <section class="card" aria-labelledby="page-title">
      <div class="status">Service online</div>
      <h1 id="page-title">Selfhosted<br>File Hosting</h1>
      <p class="subtitle">Private use only</p>
      <p class="description">
        Personal storage for files, backups, and private transfers.
        Access is restricted to authorized users.
      </p>
      <div class="notice">
        This service is not open for public registration or anonymous uploads.
      </div>
    </section>

    <footer>
      <span>Independent infrastructure</span>
      <span>Encrypted in transit</span>
    </footer>
  </main>
</body>
</html>
